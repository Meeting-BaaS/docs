name: Update OpenAPI Specification

on:
  schedule:
    # Run twice a day (06:24 and 18:24 UTC)
    - cron: '24 6,18 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      # Run immediately when the workflow itself changes on main
      - '.github/workflows/update-openapi.yml'

# Runs from all triggers mutate the same generated files, branch, and PR;
# serialize them. Never cancel a run that may already be writing.
concurrency:
  group: update-openapi
  cancel-in-progress: false

jobs:
  update-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Need full history for branch creation

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jq for JSON processing
        run: sudo apt-get install -y jq

      - name: Fetch and format OpenAPI Spec
        id: fetch-spec
        run: |
          # Create a temp directory
          mkdir -p tmp

          # Fetch the latest OpenAPI spec with error handling
          if ! curl -s -f https://api.meetingbaas.com/openapi.json > tmp/raw-openapi.json; then
            echo "Error: Failed to download OpenAPI specification"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Format the downloaded spec consistently
          cat tmp/raw-openapi.json | jq -S . > tmp/openapi.json

          # Check if openapi.json exists in repo
          V1_CHANGED=false
          if [ -f "openapi.json" ]; then
            # Format the existing file consistently for comparison
            cat openapi.json | jq -S . > tmp/existing-openapi.json

            # Compare the formatted files (jq -S sorts the keys for consistent comparison)
            if cmp -s "tmp/existing-openapi.json" "tmp/openapi.json"; then
              echo "No changes detected in the v1 OpenAPI spec"
            else
              echo "Changes detected in the v1 OpenAPI spec"
              V1_CHANGED=true

              # Save the nicely formatted version for commit
              cat tmp/raw-openapi.json | jq . > tmp/formatted-openapi.json
            fi
          else
            echo "v1 OpenAPI spec file doesn't exist yet, will create it"
            V1_CHANGED=true

            # Format nicely for the first commit
            cat tmp/raw-openapi.json | jq . > tmp/formatted-openapi.json
          fi

          # Fetch and format the v2 spec in place, using the same script as
          # local development so the committed formatting never churns
          if ! bash scripts/update-openapi-v2.sh; then
            echo "Error: Failed to download v2 OpenAPI specification"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          V2_CHANGED=false
          if ! git diff --quiet -- openapi-v2.json; then
            echo "Changes detected in the v2 OpenAPI spec"
            V2_CHANGED=true
          else
            echo "No changes detected in the v2 OpenAPI spec"
          fi

          if [ "$V1_CHANGED" = "true" ] || [ "$V2_CHANGED" = "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT

            # Generate a checksum over both specs for PR comparison
            CHECKSUM=$(cat tmp/openapi.json openapi-v2.json | sha256sum | cut -d' ' -f1)
            echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for existing PRs
        if: steps.fetch-spec.outputs.has_changes == 'true'
        id: check-prs
        run: |
          # Create a comment with the checksum to identify PRs with the same content
          CHECKSUM_COMMENT="OpenAPI-Checksum: ${{ steps.fetch-spec.outputs.checksum }}"

          # Get list of open PRs
          OPEN_PRS=$(gh pr list --json number,title,body --state open)

          # Check if any existing PR has the same checksum in its body
          EXISTING_PR=$(echo "$OPEN_PRS" | jq -r --arg checksum "$CHECKSUM_COMMENT" '.[] | select(.body | contains($checksum)) | .number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Found existing PR #$EXISTING_PR with the same OpenAPI changes"
            echo "create_pr=false" >> $GITHUB_OUTPUT
            echo "existing_pr=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            echo "No existing PR found with these changes, will create a new one"
            echo "create_pr=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create branch and PR if needed
        if: steps.fetch-spec.outputs.has_changes == 'true' && steps.check-prs.outputs.create_pr == 'true'
        run: |
          # Configure Git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Create new branch with timestamp
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          BRANCH_NAME="update-openapi-$TIMESTAMP"
          git checkout -b $BRANCH_NAME

          # Copy the formatted v1 OpenAPI spec if it changed
          # (openapi-v2.json was already updated in place by the fetch step)
          if [ -f "tmp/formatted-openapi.json" ]; then
            cp tmp/formatted-openapi.json openapi.json
          fi

          # Install dependencies for build
          pnpm install

          # Create empty .env file
          touch .env

          # Transpile TypeScript scripts first
          pnpm transpile

          # Run the pre-build script to generate API docs
          pnpm build:pre

          # Add all changes - both specs and their generated content files
          git add openapi.json openapi-v2.json
          git add content/docs/api/reference/
          git add content/docs/api-v2/reference/

          # Commit the changes
          git commit -m "Update OpenAPI specs (v1 + v2) and generated docs - $(date +'%Y-%m-%d %H:%M:%S') [Checksum: ${{ steps.fetch-spec.outputs.checksum }}]"

          # Push the branch
          git push origin $BRANCH_NAME

          # Create PR using GitHub CLI with proper YAML formatting and checksum for future identification
          gh pr create \
            --title "Update OpenAPI Specs - $(date +'%Y-%m-%d')" \
            --body $'This PR updates the OpenAPI specifications (v1 and v2) from the API.\n\nAutomatically generated by GitHub Actions at '"$(date +'%Y-%m-%d %H:%M:%S')"$'\n\nThe workflow will automatically:\n1. Fetch the latest v1 and v2 OpenAPI specs\n2. Install dependencies\n3. Run build:pre and build commands\n\nOpenAPI-Checksum: '"${{ steps.fetch-spec.outputs.checksum }}" \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_ORAMA_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_ORAMA_PROJECT_ID }}
          NEXT_PUBLIC_ORAMA_API_KEY: ${{ secrets.NEXT_PUBLIC_ORAMA_API_KEY }}

      - name: Comment on existing PR
        if: steps.fetch-spec.outputs.has_changes == 'true' && steps.check-prs.outputs.create_pr == 'false'
        run: |
          gh pr comment ${{ steps.check-prs.outputs.existing_pr }} --body "Workflow ran again on $(date +'%Y-%m-%d %H:%M:%S') and detected the same changes to the OpenAPI spec. No new PR needed."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build project with updated spec
        if: steps.fetch-spec.outputs.has_changes == 'true' && steps.check-prs.outputs.create_pr == 'true'
        run: |
          # Install dependencies
          pnpm install
          # Create empty .env file
          touch .env
          # Ensure fumadocs types are generated
          pnpm fumadocs-mdx
          # Build commands (use full build script)
          pnpm build
        env:
          NEXT_PUBLIC_ORAMA_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_ORAMA_PROJECT_ID }}
          NEXT_PUBLIC_ORAMA_API_KEY: ${{ secrets.NEXT_PUBLIC_ORAMA_API_KEY }}
          ORAMA_PRIVATE_API_KEY: ${{ secrets.ORAMA_PRIVATE_API_KEY }}
          ORAMA_SEARCH_INDEX_ID: ${{ secrets.ORAMA_SEARCH_INDEX_ID }}
          ORAMA_AI_INDEX_ID: ${{ secrets.ORAMA_AI_INDEX_ID }}

      - name: Upload artifacts
        if: steps.fetch-spec.outputs.has_changes == 'true' && steps.check-prs.outputs.create_pr == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next
            out
            dist
